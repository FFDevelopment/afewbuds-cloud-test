name: Verify cloudtest16 inventory UI
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cloudtest16-open.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify packed inventory
        shell: python
        run: |
          from pathlib import Path
          import struct,re
          b=Path("index-cloudtest16.pck").read_bytes()
          fb=struct.unpack_from("<Q",b,24)[0]; do=struct.unpack_from("<Q",b,32)[0]
          n=struct.unpack_from("<I",b,do)[0]; p=do+4; files={}
          for _ in range(n):
              q=struct.unpack_from("<I",b,p)[0]; p+=4
              name=b[p:p+q].rstrip(b"\0").decode(); p+=q
              off=struct.unpack_from("<Q",b,p)[0]; p+=8
              size=struct.unpack_from("<Q",b,p)[0]; p+=8
              p+=20
              data=b[fb+off:fb+off+size]
              if name.endswith(".gd"):
                  files[name]=data.decode("utf-8","replace").rstrip(" \n\0")
          main=files["scripts/main.gd"]; inv=files["scripts/personal_inventory.gd"]
          def fn(text,name):
              m=re.search(r'^func '+re.escape(name)+r'\([^\n]*\)(?: -> [^:]+)?:\n.*?(?=^func |\Z)',text,re.M|re.S)
              return m.group(0).rstrip() if m else "<MISSING>"
          print("===== SETUP =====")
          print(fn(inv,"setup"))
          print("===== BAG =====")
          print(fn(main,"_open_backpack_direct"))
          print("===== LOCKER APPROACH =====")
          print(fn(main,"_finish_direct_station_approach"))
          assert "game.hud.add_child(inventory_root)" in fn(inv,"setup")
          assert "if personal_inventory == null:" in fn(main,"_open_backpack_direct")
          locker=fn(main,"_finish_direct_station_approach")
          assert '"station_locker":' in locker
          assert "_init_personal_inventory_deferred()" in locker
          assert "personal_inventory.open_locker()" in locker
          print("VERIFY OK")
