name: Validate Reeves follow-up candidate
on:
  push:
    branches: [fix/reeves-followup-mobile-beta7]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild mobile test candidate
        run: python3 tools/mobile_3d_movement/build.py --output-dir "${RUNNER_TEMP}/candidate"
      - name: Install Godot 4.7.2
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Import and run Reeves and property regression checks
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "${GODOT}" --headless --path "${RUNNER_TEMP}/candidate/candidate" --editor --import --quit
          for spec in "tools/reward_contact_v1/check.gd|REWARD_CONTACT_RESULT: PASS" "tools/property_isolation_v1/check.gd|PROPERTY_ISOLATION_RESULT: PASS" "tools/progression_v1/check.gd|PROGRESSION_V1_TEST_RESULT: PASS"; do
            script="${spec%%|*}"
            expected="${spec#*|}"
            XDG_DATA_HOME="$(mktemp -d)" timeout 180s "${GODOT}" --headless --path "${RUNNER_TEMP}/candidate/candidate" --script "${GITHUB_WORKSPACE}/${script}" 2>&1 | tee /tmp/afb-check.log
            grep -q "${expected}" /tmp/afb-check.log
            if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/afb-check.log; then exit 1; fi
          done
