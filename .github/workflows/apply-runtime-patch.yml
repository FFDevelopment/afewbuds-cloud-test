name: Apply runtime patch
on:
  push:
    branches: [main]
    paths:
      - "tools/patch_runtime.py"
      - ".github/workflows/apply-runtime-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply PCK patch
        run: python tools/patch_runtime.py
      - name: Commit patched runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-accountsync11.pck index.html version.json
          if git diff --cached --quiet; then
            echo "No runtime changes."
          else
            git commit -m "Fix room resume and force backpack HUD button"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
