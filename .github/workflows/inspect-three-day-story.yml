name: Inspect three day story logic
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-three-day-story.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect packed story day references
        shell: python
        run: |
          from pathlib import Path
          import struct,re
          b=Path("index-cloudtest10.pck").read_bytes()
          fb=struct.unpack_from("<Q",b,24)[0]; do=struct.unpack_from("<Q",b,32)[0]
          n=struct.unpack_from("<I",b,do)[0]; p=do+4; main=""
          for _ in range(n):
              q=struct.unpack_from("<I",b,p)[0]; p+=4
              name=b[p:p+q].rstrip(b"\0").decode(); p+=q
              off=struct.unpack_from("<Q",b,p)[0]; p+=8
              size=struct.unpack_from("<Q",b,p)[0]; p+=8
              p+=20
              if name=="scripts/main.gd":
                  main=b[fb+off:fb+off+size].decode("utf-8","replace").rstrip(" \n\0")
                  break
          lines=main.splitlines()
          for i,line in enumerate(lines,1):
              low=line.lower()
              if "3 days" in low or "three days" in low or "days_lay" in low or "lay_low_days" in low or ("day" in low and "reeves" in low):
                  print("\n---",i,"---")
                  for j in range(max(0,i-5), min(len(lines),i+6)):
                      print(j+1,lines[j])
