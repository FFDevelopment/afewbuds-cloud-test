name: Inspect storefront phone control
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-storefront-control.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect cloudtest24 storefront control
        shell: python
        run: |
          from pathlib import Path
          import struct,re
          b=Path("index-cloudtest24.pck").read_bytes()
          fb=struct.unpack_from("<Q",b,24)[0]; do=struct.unpack_from("<Q",b,32)[0]
          n=struct.unpack_from("<I",b,do)[0]; p=do+4; main=""
          for _ in range(n):
              q=struct.unpack_from("<I",b,p)[0]; p+=4
              name=b[p:p+q].rstrip(b"\0").decode(); p+=q
              off=struct.unpack_from("<Q",b,p)[0]; p+=8
              size=struct.unpack_from("<Q",b,p)[0]; p+=8
              p+=20
              if name=="scripts/main.gd":
                  main=b[fb+off:fb+off+size].decode("utf-8","replace").rstrip(" \n\0")
                  break
          def fn(name):
              m=re.search(r'^func '+re.escape(name)+r'\([^\n]*\)(?: -> [^:]+)?:\n.*?(?=^func |\Z)',main,re.M|re.S)
              return m.group(0).rstrip() if m else "<MISSING>"
          for name in ["_build_budshop_app","_build_shop_app","_build_supplies_app","_build_products_app","_toggle_business","_toggle_storefront","_set_business_open"]:
              print("\n===== "+name+" =====")
              print(fn(name))
          print("\n===== STOREFRONT REFERENCES =====")
          for i,line in enumerate(main.splitlines(),1):
              if "Storefront" in line or "business_open" in line or "OPEN" in line and "Store" in line:
                  if 3000 <= i <= 6500:
                      print(i,line)
