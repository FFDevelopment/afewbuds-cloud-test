name: Validate cloudtest35 branch
on:
  push:
    branches: [cloudtest35-account-settings]
    paths:
      - "tools/patch_runtime.py"
      - "index.html"
      - "supabase/PATCH_ACCOUNT_SETTINGS_35.sql"
      - ".github/workflows/validate-cloudtest35.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python -m py_compile tools/patch_runtime.py
      - name: Inspect actual PCK phone home
        shell: python
        run: |
          from pathlib import Path
          import struct,re
          b=Path("index-cloudtest10.pck").read_bytes()
          fb=struct.unpack_from("<Q",b,24)[0]; do=struct.unpack_from("<Q",b,32)[0]
          n=struct.unpack_from("<I",b,do)[0]; p=do+4; main=""
          for _ in range(n):
              q=struct.unpack_from("<I",b,p)[0]; p+=4
              name=b[p:p+q].rstrip(b"\0").decode(); p+=q
              off=struct.unpack_from("<Q",b,p)[0]; p+=8
              size=struct.unpack_from("<Q",b,p)[0]; p+=8
              p+=20
              if name=="scripts/main.gd":
                  main=b[fb+off:fb+off+size].decode("utf-8","replace").rstrip(" \n\0")
                  break
          for name in ["_build_phone_home","_build_settings_app","_refresh_phone","_phone_parent_app"]:
              m=re.search(r'^func '+re.escape(name)+r'\([^\n]*\)(?: -> [^:]+)?:\n.*?(?=^func |\Z)',main,re.M|re.S)
              print("\n===== "+name+" =====")
              print(m.group(0).rstrip() if m else "<MISSING>")
      - name: Dry-run runtime patch
        run: python tools/patch_runtime.py
      - name: Verify cloudtest35 output
        run: |
          grep -q '0.7.9-beta.19-cloudtest.35' version.json
          grep -q 'afb-account-settings-modal' index.html
          grep -q 'index-cloudtest10.pck?build=35' index.html
          git diff --check
          echo "cloudtest35 branch validation passed"
