name: Inspect critical heat staff logic
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-critical-heat-staff.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect packed staff dealer friend logic
        shell: python
        run: |
          from pathlib import Path
          import struct,re
          b=Path("index-cloudtest10.pck").read_bytes()
          fb=struct.unpack_from("<Q",b,24)[0]; do=struct.unpack_from("<Q",b,32)[0]
          n=struct.unpack_from("<I",b,do)[0]; p=do+4; main=""
          for _ in range(n):
              q=struct.unpack_from("<I",b,p)[0]; p+=4
              name=b[p:p+q].rstrip(b"\0").decode(); p+=q
              off=struct.unpack_from("<Q",b,p)[0]; p+=8
              size=struct.unpack_from("<Q",b,p)[0]; p+=8
              p+=20
              if name=="scripts/main.gd":
                  main=b[fb+off:fb+off+size].decode("utf-8","replace").rstrip(" \n\0")
                  break
          pat=re.compile(r'^func ([A-Za-z0-9_]+)\([^\n]*\)(?: -> [^:]+)?:\n.*?(?=^func |\Z)',re.M|re.S)
          keys=["dealer","packing_employee","production_worker","friend_staff","friend","message","text","sms","phone"]
          for m in pat.finditer(main):
              name=m.group(1); block=m.group(0); low=block.lower()
              if any(k in low for k in keys):
                  if any(k in low for k in ["dealer","packing_employee","production_worker","friend_staff","send_text","message","sms"]):
                      print("\n===== "+name+" =====")
                      print(block)
