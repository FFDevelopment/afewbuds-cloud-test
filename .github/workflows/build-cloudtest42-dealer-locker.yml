name: Build cloudtest42 dealer locker
on:
  push:
    branches: [main]
    paths:
      - "tools/patch_cloudtest42_dealer_locker.py"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch dealer locker runtime
        run: python tools/patch_cloudtest42_dealer_locker.py
      - name: Commit cloudtest42
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-cloudtest10.pck index.html version.json BUILD_VERSION.txt
          if git diff --cached --quiet; then
            echo "No runtime changes"
            exit 0
          fi
          git commit -m "Publish cloudtest42 dealer locker system"
          git pull --rebase origin main
          git push
