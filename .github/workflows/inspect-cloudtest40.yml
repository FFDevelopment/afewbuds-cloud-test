name: Inspect cloudtest40 phone baseline
on:
  push:
    branches: [cloudtest40-phone-leaderboard]
    paths:
      - ".github/workflows/inspect-cloudtest40.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact .39 PCK phone functions
        shell: python
        run: |
          from pathlib import Path
          import struct,re,collections
          b=Path("index-cloudtest10.pck").read_bytes()
          fb=struct.unpack_from("<Q",b,24)[0]
          do=struct.unpack_from("<Q",b,32)[0]
          n=struct.unpack_from("<I",b,do)[0]
          p=do+4
          main=""
          for _ in range(n):
              q=struct.unpack_from("<I",b,p)[0]; p+=4
              name=b[p:p+q].rstrip(b"\0").decode(); p+=q
              off=struct.unpack_from("<Q",b,p)[0]; p+=8
              size=struct.unpack_from("<Q",b,p)[0]; p+=8
              p+=20
              if name=="scripts/main.gd":
                  main=b[fb+off:fb+off+size].decode("utf-8","replace").rstrip(" \n\0")
                  break
          if not main:
              raise SystemExit("main.gd missing")
          def grab(name):
              m=re.search(r"^func "+re.escape(name)+r"\([^\n]*\)(?: -> [^:]+)?:\n.*?(?=^func |\Z)",main,re.M|re.S)
              print("\n===== "+name+" =====")
              print(m.group(0) if m else "MISSING")
          for name in ["_build_phone_home","_refresh_phone","_phone_parent_app","_open_phone_app"]:
              grab(name)
          names=re.findall(r"^func\s+([A-Za-z0-9_]+)\(",main,re.M)
          dup={k:v for k,v in collections.Counter(names).items() if v>1}
          print("\nDUPLICATES",dup)
