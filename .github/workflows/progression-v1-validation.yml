name: Validate progression v1 candidate

on:
  push:
    branches: [experiment/mobile-3d-movement]
    paths:
      - ".github/workflows/progression-v1-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: progression-v1-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/mobile-3d-movement
          fetch-depth: 0

      - name: Build candidate
        run: |
          set -euo pipefail
          python3 tools/mobile_3d_movement/build.py --output-dir "${RUNNER_TEMP}/mobile3d"

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot

      - name: Import candidate
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          timeout 120s "${GODOT}" --headless --path "${RUNNER_TEMP}/mobile3d/candidate" --editor --import --quit

      - name: Test movement and progression
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          timeout 180s "${GODOT}" --headless --path "${RUNNER_TEMP}/mobile3d/candidate" --script "${GITHUB_WORKSPACE}/tools/mobile_3d_movement/check.gd" 2>&1 | tee "${RUNNER_TEMP}/mobile3d-check.log"
          grep -q "MOBILE_3D_TEST_RESULT: PASS" "${RUNNER_TEMP}/mobile3d-check.log"
          ! grep -E 'SCRIPT ERROR|^ERROR:' "${RUNNER_TEMP}/mobile3d-check.log"
          timeout 120s "${GODOT}" --headless --path "${RUNNER_TEMP}/mobile3d/candidate" --script "${GITHUB_WORKSPACE}/tools/progression_v1/check.gd" 2>&1 | tee "${RUNNER_TEMP}/progression-v1-check.log"
          grep -q "PROGRESSION_V1_TEST_RESULT: PASS" "${RUNNER_TEMP}/progression-v1-check.log"
          ! grep -E 'SCRIPT ERROR|^ERROR:' "${RUNNER_TEMP}/progression-v1-check.log"

      - name: Commit verified runtime
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/mobile-3d-v1.patch.json shared/afb-runtime-mobile-3d-v1.js index.html version.json BUILD_VERSION.txt tools/mobile_3d_movement/build_receipt.json
          if ! git diff --cached --quiet; then
            git commit -m "Build verified Chapter 4 progression preview"
            git fetch origin experiment/mobile-3d-movement
            git rebase origin/experiment/mobile-3d-movement
            git push origin HEAD:experiment/mobile-3d-movement
          fi
