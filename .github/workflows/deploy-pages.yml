name: Deploy standalone cloud test
# deploy-current-main

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/bootstrap-cloud-test.yml"
  workflow_run:
    workflows: ["Apply runtime patch", "Rebuild cloud test from main"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage active web runtime
        run: python3 tools/stage_pages.py --output "${{ runner.temp }}/afb-pages"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/afb-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
