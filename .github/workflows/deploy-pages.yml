name: Deploy cloud-test baseline

on:
  workflow_run:
    workflows: ["Build mobile baseline"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage active web runtime
        run: python3 tools/stage_pages.py --output "${{ runner.temp }}/afb-pages"

      - name: Preserve the existing mobile 3D URL
        run: |
          set -euo pipefail
          python3 tools/stage_pages.py --output "${RUNNER_TEMP}/afb-mobile3d"
          mkdir -p "${RUNNER_TEMP}/afb-pages/mobile-3d-movement"
          cp -a "${RUNNER_TEMP}/afb-mobile3d/." "${RUNNER_TEMP}/afb-pages/mobile-3d-movement/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/afb-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
