name: Diagnose cloudtest18 gray screen
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-cloudtest18.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare cloudtest12 and cloudtest18 scripts
        shell: python
        run: |
          from pathlib import Path
          import struct,re,difflib

          def extract(path,target="scripts/main.gd"):
              b=Path(path).read_bytes()
              fb=struct.unpack_from("<Q",b,24)[0]
              do=struct.unpack_from("<Q",b,32)[0]
              n=struct.unpack_from("<I",b,do)[0]
              p=do+4
              for _ in range(n):
                  q=struct.unpack_from("<I",b,p)[0]; p+=4
                  name=b[p:p+q].rstrip(b"\0").decode(); p+=q
                  off=struct.unpack_from("<Q",b,p)[0]; p+=8
                  size=struct.unpack_from("<Q",b,p)[0]; p+=8
                  p+=20
                  if name==target:
                      return b[fb+off:fb+off+size].decode("utf-8","replace").rstrip(" \n\0")
              return "<MISSING>"

          a=extract("index-cloudtest12.pck")
          b=extract("index-cloudtest18.pck")

          def func(text,name):
              m=re.search(r'^func '+re.escape(name)+r'\([^\n]*\)(?: -> [^:]+)?:\n.*?(?=^func |\Z)',text,re.M|re.S)
              return m.group(0).rstrip() if m else "<MISSING>"

          for name in ["_ready","_build_ui","_init_personal_inventory_deferred","_open_backpack_direct","_approach_station_then_open","_finish_direct_station_approach","_nav","_any_modal_open"]:
              aa=func(a,name).splitlines(); bb=func(b,name).splitlines()
              d=list(difflib.unified_diff(aa,bb,fromfile="cloud12",tofile="cloud18",lineterm=""))
              print("\n===== "+name+" =====")
              print("\n".join(d) if d else "IDENTICAL")

          print("\n===== TOP DECLARATIONS DIFF =====")
          for line in difflib.unified_diff(a.splitlines()[:180],b.splitlines()[:180],fromfile="cloud12",tofile="cloud18",lineterm=""):
              print(line)

          print("\n===== SUSPICIOUS INVENTORY REFERENCES IN 18 =====")
          for i,line in enumerate(b.splitlines(),1):
              if "personal_inventory" in line or "PersonalInventory" in line or "backpack_quick_button" in line:
                  print(i,line)
