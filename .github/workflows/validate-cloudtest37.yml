name: Validate cloudtest37 leaderboard
on:
  push:
    branches: [cloudtest37-global-leaderboard]
    paths:
      - "index.html"
      - "shared/afb-cloud-accountsync10.js"
      - "tools/patch_runtime.py"
      - "supabase/PATCH_GLOBAL_LEADERBOARD_37.sql"
      - ".github/workflows/validate-cloudtest37.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python patch syntax
        run: python -m py_compile tools/patch_runtime.py
      - name: Dry-run PCK patch
        run: python tools/patch_runtime.py
      - name: Extract browser JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re
          html=Path("index.html").read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          inline=[s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit("No inline browser script found")
          Path("/tmp/afb-inline.js").write_text(inline[-1])
          required=[
              '0.7.9-beta.19-cloudtest.37',
              'id="afb-leaderboard-modal"',
              'window.AFB_LEADERBOARD = {',
              "afb_leaderboard_get",
              "afb_leaderboard_profile",
              "View Top 25",
              "Weekly",
          ]
          for needle in required:
              if needle not in html:
                  raise SystemExit("Missing "+needle)
      - name: Check browser and cloud-sync JavaScript syntax
        run: |
          node --check /tmp/afb-inline.js
          node --check shared/afb-cloud-accountsync10.js
      - name: Verify leaderboard backend source
        run: |
          grep -q "afb_leaderboard_report" supabase/PATCH_GLOBAL_LEADERBOARD_37.sql
          grep -q "afb_leaderboard_get" supabase/PATCH_GLOBAL_LEADERBOARD_37.sql
          grep -q "afb_leaderboard_profile" supabase/PATCH_GLOBAL_LEADERBOARD_37.sql
          grep -q "America/New_York" supabase/PATCH_GLOBAL_LEADERBOARD_37.sql
          grep -q "GLOBAL LEADERBOARD" tools/patch_runtime.py
          grep -q "window.AFB_LEADERBOARD" tools/patch_runtime.py
          git diff --check
          echo "cloudtest37 leaderboard validation passed"
