name: Inspect text and worker functions
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-text-worker-functions.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print focused functions
        shell: python
        run: |
          from pathlib import Path
          import struct,re
          b=Path("index-cloudtest10.pck").read_bytes()
          fb=struct.unpack_from("<Q",b,24)[0]; do=struct.unpack_from("<Q",b,32)[0]
          n=struct.unpack_from("<I",b,do)[0]; p=do+4; main=""
          for _ in range(n):
              q=struct.unpack_from("<I",b,p)[0]; p+=4
              name=b[p:p+q].rstrip(b"\0").decode(); p+=q
              off=struct.unpack_from("<Q",b,p)[0]; p+=8
              size=struct.unpack_from("<Q",b,p)[0]; p+=8
              p+=20
              if name=="scripts/main.gd":
                  main=b[fb+off:fb+off+size].decode("utf-8","replace").rstrip(" \n\0")
                  break
          pat=re.compile(r'^func ([A-Za-z0-9_]+)\([^\n]*\)(?: -> [^:]+)?:\n.*?(?=^func |\Z)',re.M|re.S)
          names=["_text_known_customer","_update_production_worker_visual","_sync_production_worker_visual","_reset_production_worker_navigation","_production_worker_station_position","_add_heat","_refresh_phone","_phone_parent_app","_build_phone_home","_build_employees_app"]
          for name in names:
              m=re.search(r'^func '+re.escape(name)+r'\([^\n]*\)(?: -> [^:]+)?:\n.*?(?=^func |\Z)',main,re.M|re.S)
              print("\n===== "+name+" =====")
              print(m.group(0).rstrip() if m else "<MISSING>")
          print("\n===== PHONE DOCK CALLS =====")
          for i,line in enumerate(main.splitlines(),1):
              if "_add_phone_dock_button(" in line and not line.lstrip().startswith("func "):
                  print(i,line)
