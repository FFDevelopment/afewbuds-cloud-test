name: Validate worker and business UI - mobile
on:
  push:
    branches: [fix/staff-controls-and-performance-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staff-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build mobile game with shared staff screens
        run: python3 tools/mobile_3d_movement/build.py --output-dir "${RUNNER_TEMP}/afb"
      - name: Verify script cache stamps and save protocol
        run: python3 tools/mobile_3d_movement/check_release_stamp.py
      - name: Install Godot 4.7.2
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Import rebuilt game
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path "${RUNNER_TEMP}/afb/candidate" --editor --import --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/import.log; then exit 1; fi
      - name: Verify property, crew, inventory and equipment regressions
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          for spec in "tools/mobile_3d_movement/check.gd|MOBILE_3D_TEST_RESULT: PASS" "tools/staff_ui_v1/check.gd|STAFF_UI_RESULT: PASS" "tools/property_isolation_v1/check.gd|PROPERTY_ISOLATION_RESULT: PASS" "tools/reward_contact_v1/check.gd|REWARD_CONTACT_RESULT: PASS" "tools/inventory_v1/check.gd|INVENTORY_TEST_RESULT: PASS" "tools/equipment_v2/check.gd|EQUIPMENT_V2_RESULT: PASS" "tools/dynamic_property_v1/check.gd|DYNAMIC_PROPERTY_REGISTRY_RESULT: PASS" "tools/item_registry_v1/check.gd|ITEM_REGISTRY_RESULT: PASS"; do
            file="${spec%%|*}"; marker="${spec#*|}"
            XDG_DATA_HOME="$(mktemp -d)" timeout 180s "${GODOT}" --headless --path "${RUNNER_TEMP}/afb/candidate" --script "${GITHUB_WORKSPACE}/${file}" 2>&1 | tee /tmp/game.log
            grep -q "${marker}" /tmp/game.log
            if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/game.log; then exit 1; fi
          done
