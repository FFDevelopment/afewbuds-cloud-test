name: Validate cloudtest38 grey-screen hotfix
on:
  push:
    branches: [cloudtest38-grey-screen-hotfix]
    paths:
      - "tools/patch_runtime.py"
      - ".github/workflows/validate-cloudtest38.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate patch syntax
        run: python -m py_compile tools/patch_runtime.py
      - name: Repair PCK
        run: python tools/patch_runtime.py
      - name: Inspect repaired GDScript
        shell: python
        run: |
          from pathlib import Path
          import struct,re,collections
          b=Path("index-cloudtest10.pck").read_bytes()
          fb=struct.unpack_from("<Q",b,24)[0]
          do=struct.unpack_from("<Q",b,32)[0]
          n=struct.unpack_from("<I",b,do)[0]
          p=do+4
          main=""
          for _ in range(n):
              q=struct.unpack_from("<I",b,p)[0]; p+=4
              name=b[p:p+q].rstrip(b"\0").decode(); p+=q
              off=struct.unpack_from("<Q",b,p)[0]; p+=8
              size=struct.unpack_from("<Q",b,p)[0]; p+=8
              p+=20
              if name=="scripts/main.gd":
                  main=b[fb+off:fb+off+size].decode("utf-8","replace").rstrip(" \n\0")
                  break
          if not main:
              raise SystemExit("scripts/main.gd missing")
          names=re.findall(r'^func\s+([A-Za-z0-9_]+)\(',main,re.M)
          dup={k:v for k,v in collections.Counter(names).items() if v>1}
          if dup:
              raise SystemExit("Duplicate GDScript functions remain: "+repr(dup))
          for name in ["_build_account_app","_open_web_account_settings","_open_web_leaderboard","_build_stats_app"]:
              c=names.count(name)
              if c!=1:
                  raise SystemExit(f"{name} count={c}")
          m=re.search(r'^func _refresh_phone\(\) -> void:\n.*?(?=^func |\Z)',main,re.M|re.S)
          if not m:
              raise SystemExit("_refresh_phone missing")
          account_arms=len(re.findall(r'^\t\t"account":$',m.group(0),re.M))
          if account_arms!=1:
              raise SystemExit(f"account match arm count={account_arms}")
          Path("/tmp/repaired-main.gd").write_text(main)
          print("Repaired GDScript has",len(names),"unique functions and one Account route.")
      - name: Verify browser shell and release
        shell: python
        run: |
          from pathlib import Path
          import re
          html=Path("index.html").read_text()
          if '0.7.9-beta.19-cloudtest.38' not in html:
              raise SystemExit("release .38 missing")
          if 'index-cloudtest10.pck?build=38' not in html:
              raise SystemExit("cache-busted PCK build 38 missing")
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          inline=[s for s in scripts if s.strip()]
          Path("/tmp/afb-inline.js").write_text(inline[-1])
      - name: Check browser JavaScript
        run: |
          node --check /tmp/afb-inline.js
          node --check shared/afb-cloud-accountsync10.js
          git diff --check
          echo "cloudtest38 grey-screen hotfix validation passed"
