name: Inspect lay low task logic
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-lay-low-task.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect packed lay low logic
        shell: python
        run: |
          from pathlib import Path
          import struct,re
          b=Path("index-cloudtest10.pck").read_bytes()
          fb=struct.unpack_from("<Q",b,24)[0]; do=struct.unpack_from("<Q",b,32)[0]
          n=struct.unpack_from("<I",b,do)[0]; p=do+4; main=""
          for _ in range(n):
              q=struct.unpack_from("<I",b,p)[0]; p+=4
              name=b[p:p+q].rstrip(b"\0").decode(); p+=q
              off=struct.unpack_from("<Q",b,p)[0]; p+=8
              size=struct.unpack_from("<Q",b,p)[0]; p+=8
              p+=20
              if name=="scripts/main.gd":
                  main=b[fb+off:fb+off+size].decode("utf-8","replace").rstrip(" \n\0")
                  break
          for i,line in enumerate(main.splitlines(),1):
              low=line.lower()
              if "lay low" in low or "lay_low" in low or "laid low" in low or "days" in low and "heat" in low:
                  print(i,line)
          print("\n=== ADVANCEMENT HEAT ENTRIES ===")
          for i,line in enumerate(main.splitlines(),1):
              if '"category": "Heat"' in line:
                  print(i,line)
