name: Build cloudtest20 HUD lift

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-cloudtest20.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build from stable cloudtest19
        shell: python
        run: |
          from pathlib import Path
          import struct,hashlib,re,json

          SRC=Path("index-cloudtest19.pck")
          OUT=Path("index-cloudtest20.pck")
          blob=SRC.read_bytes()
          fb=struct.unpack_from("<Q",blob,24)[0]
          do=struct.unpack_from("<Q",blob,32)[0]
          n=struct.unpack_from("<I",blob,do)[0]
          p=do+4
          entries=[]
          for _ in range(n):
              q=struct.unpack_from("<I",blob,p)[0]; p+=4
              name=blob[p:p+q].rstrip(b"\0").decode(); p+=q
              off=struct.unpack_from("<Q",blob,p)[0]; p+=8
              size=struct.unpack_from("<Q",blob,p)[0]; p+=8
              md5=blob[p:p+16]; p+=16
              flags=struct.unpack_from("<I",blob,p)[0]; p+=4
              data=blob[fb+off:fb+off+size]
              if hashlib.md5(data).digest()!=md5:
                  raise SystemExit("md5 mismatch "+name)
              entries.append([name,data,flags])

          for row in entries:
              if row[0]!="scripts/main.gd":
                  continue
              t=row[1].decode("utf-8","replace").rstrip(" \n\0")
              t=t.replace("CLOUD TEST .19","CLOUD TEST .20")
              old='''\thud = Control.new()
\thud.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
\tadd_child(hud)
'''
              new='''\thud = Control.new()
\thud.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
\thud.position = Vector2(0, -12)
\tadd_child(hud)
'''
              if old not in t:
                  raise SystemExit("HUD creation block missing")
              t=t.replace(old,new,1)
              if 'hud.position = Vector2(0, -12)' not in t:
                  raise SystemExit("HUD lift verification failed")
              row[1]=t.encode()

          out=bytearray(blob[:fb]); cur=0; directory=[]
          for name,data,flags in entries:
              aligned=(cur+31)//32*32
              out.extend(b"\0"*(aligned-cur))
              off=aligned
              out.extend(data)
              cur=off+len(data)
              directory.append((name,off,len(data),hashlib.md5(data).digest(),flags))
          ndo=(len(out)+31)//32*32
          out.extend(b"\0"*(ndo-len(out)))
          struct.pack_into("<Q",out,32,ndo)
          out.extend(struct.pack("<I",len(directory)))
          for name,off,size,md5,flags in directory:
              raw=name.encode(); q=(len(raw)+3)//4*4
              out.extend(struct.pack("<I",q)); out.extend(raw); out.extend(b"\0"*(q-len(raw)))
              out.extend(struct.pack("<Q",off)); out.extend(struct.pack("<Q",size)); out.extend(md5); out.extend(struct.pack("<I",flags))
          OUT.write_bytes(out)

          h=Path("index.html").read_text()
          h=re.sub(r'const AFB_TEST_RELEASE = "[^"]+";','const AFB_TEST_RELEASE = "0.7.9-beta.19-cloudtest.20";',h,1)
          h=re.sub(r'"fileSizes":\{[^}]*\}',f'"fileSizes":{{"{OUT.name}":{len(out)},"index.wasm":37902138}}',h,1)
          h=re.sub(r'"mainPack":"[^"]+"',f'"mainPack":"{OUT.name}"',h,1)
          Path("index.html").write_text(h)

          v=json.loads(Path("version.json").read_text())
          v["release_id"]="0.7.9-beta.19-cloudtest.20"
          v["hud_adjustment"]="moved-up-12px"
          Path("version.json").write_text(json.dumps(v,indent=2)+"\n")
          print("cloudtest20 built from stable cloudtest19; HUD moved up 12px")
      - name: Commit generated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-cloudtest20.pck index.html version.json
          git commit -m "Publish cloudtest20 HUD lift"
          git push origin HEAD:main
