name: Inspect dealer settlement and supply purchase
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-dealer-settlement-supply.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect focused functions
        shell: python
        run: |
          from pathlib import Path
          import struct,re
          b=Path("index-cloudtest10.pck").read_bytes()
          fb=struct.unpack_from("<Q",b,24)[0]; do=struct.unpack_from("<Q",b,32)[0]
          n=struct.unpack_from("<I",b,do)[0]; p=do+4; main=""
          for _ in range(n):
              q=struct.unpack_from("<I",b,p)[0]; p+=4
              name=b[p:p+q].rstrip(b"\0").decode(); p+=q
              off=struct.unpack_from("<Q",b,p)[0]; p+=8
              size=struct.unpack_from("<Q",b,p)[0]; p+=8
              p+=20
              if name=="scripts/main.gd":
                  main=b[fb+off:fb+off+size].decode("utf-8","replace").rstrip(" \n\0")
                  break
          for name in ["_buy_supply","_supply_is_purchased","_settle_dealer_cash","_process_dealer_dropoff","_finish_daily_closeout","_start_next_day","_record_daily_sale","_add_inventory","_inventory_grams"]:
              m=re.search(r'^func '+re.escape(name)+r'\([^\n]*\)(?: -> [^:]+)?:\n.*?(?=^func |\Z)',main,re.M|re.S)
              print("\n===== "+name+" =====")
              print(m.group(0).rstrip() if m else "<MISSING>")
          print("\n===== DEALER CASH REFERENCES =====")
          for i,line in enumerate(main.splitlines(),1):
              low=line.lower()
              if "dealer_cash_held" in low or "dealer_commission_held" in low or "dealer balance" in low:
                  print(i,line)
