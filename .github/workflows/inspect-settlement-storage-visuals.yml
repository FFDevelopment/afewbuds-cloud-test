name: Inspect settlement and storage visuals
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-settlement-storage-visuals.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print focused line ranges
        shell: python
        run: |
          from pathlib import Path
          import struct
          b=Path("index-cloudtest10.pck").read_bytes()
          fb=struct.unpack_from("<Q",b,24)[0]; do=struct.unpack_from("<Q",b,32)[0]
          n=struct.unpack_from("<I",b,do)[0]; p=do+4; main=""
          for _ in range(n):
              q=struct.unpack_from("<I",b,p)[0]; p+=4
              name=b[p:p+q].rstrip(b"\0").decode(); p+=q
              off=struct.unpack_from("<Q",b,p)[0]; p+=8
              size=struct.unpack_from("<Q",b,p)[0]; p+=8
              p+=20
              if name=="scripts/main.gd":
                  main=b[fb+off:fb+off+size].decode("utf-8","replace").rstrip(" \n\0")
                  break
          lines=main.splitlines()
          for title,a,z in [
              ("SUPPLY CATALOG",470,505),
              ("CLOSEOUT CONT",1290,1400),
              ("WORLD STORAGE BUILD",2240,2460),
              ("VISUAL UPGRADES",2380,2465),
              ("PLANT RESET/HARVEST",4620,4715)
          ]:
              print("\n===== "+title+" =====")
              for i in range(a-1,min(z,len(lines))):
                  print(i+1,lines[i])
