name: Validate cloudtest40 phone leaderboard
on:
  push:
    branches: [cloudtest40-phone-leaderboard]
    paths:
      - "index.html"
      - "shared/afb-cloud-accountsync10.js"
      - "tools/patch_cloudtest40_leaderboard.py"
      - ".github/workflows/validate-cloudtest40.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate patcher syntax
        run: python -m py_compile tools/patch_cloudtest40_leaderboard.py
      - name: Build isolated cloudtest40 PCK
        run: python tools/patch_cloudtest40_leaderboard.py
      - name: Inspect patched GDScript
        shell: python
        run: |
          from pathlib import Path
          import struct,re,collections,hashlib
          b=Path("index-cloudtest10.pck").read_bytes()
          fb=struct.unpack_from("<Q",b,24)[0]
          do=struct.unpack_from("<Q",b,32)[0]
          n=struct.unpack_from("<I",b,do)[0]
          p=do+4
          main=""
          for _ in range(n):
              q=struct.unpack_from("<I",b,p)[0]; p+=4
              name=b[p:p+q].rstrip(b"\0").decode(); p+=q
              off=struct.unpack_from("<Q",b,p)[0]; p+=8
              size=struct.unpack_from("<Q",b,p)[0]; p+=8
              p+=20
              if name=="scripts/main.gd":
                  main=b[fb+off:fb+off+size].decode("utf-8","replace").rstrip(" \n\0")
                  break
          if not main:
              raise SystemExit("main.gd missing")
          names=re.findall(r"^func\s+([A-Za-z0-9_]+)\(",main,re.M)
          dup={k:v for k,v in collections.Counter(names).items() if v>1}
          if dup:
              raise SystemExit("Duplicate GDScript functions: "+repr(dup))
          checks=[
              ('home tile', main.count('"Leaderboard", "Weekly & lifetime rankings", "leaderboard"')==1),
              ('leaderboard route', len(re.findall(r'^\t\t"leaderboard":$',main,re.M))==1),
              ('leaderboard page', names.count('_build_leaderboard_app')==1),
              ('leaderboard bridge', names.count('_open_web_leaderboard')==1),
              ('web call', main.count('window.AFB_LEADERBOARD && window.AFB_LEADERBOARD.open();')==1),
          ]
          for label,ok in checks:
              if not ok: raise SystemExit("Failed "+label)
          Path("/tmp/pck-first.sha256").write_text(hashlib.sha256(b).hexdigest())
          print("Patched GDScript has",len(names),"unique functions.")
      - name: Prove patcher is idempotent
        run: |
          python tools/patch_cloudtest40_leaderboard.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          before=Path("/tmp/pck-first.sha256").read_text().strip()
          after=hashlib.sha256(Path("index-cloudtest10.pck").read_bytes()).hexdigest()
          print("first",before)
          print("second",after)
          if before != after:
              raise SystemExit("Second patch changed PCK bytes")
          PY
      - name: Check browser JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re
          html=Path("index.html").read_text()
          required=[
              '0.7.9-beta.19-cloudtest.40',
              'id="afb-leaderboard-modal"',
              'window.AFB_LEADERBOARD',
              'View Top 25',
              'Lifetime',
              'Weekly'
          ]
          for needle in required:
              if needle not in html:
                  raise SystemExit("Missing "+needle)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          inline=[s for s in scripts if s.strip()]
          Path("/tmp/afb-inline.js").write_text(inline[-1])
      - name: Check JS syntax and diff
        run: |
          node --check /tmp/afb-inline.js
          node --check shared/afb-cloud-accountsync10.js
          git diff --check
          echo "cloudtest40 phone leaderboard validation passed"
