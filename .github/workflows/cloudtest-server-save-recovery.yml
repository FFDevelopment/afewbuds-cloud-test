name: Verify mobile Cloud Test server-save recovery
on:
  push:
    branches: [fix/cloudtest-server-save-recovery]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prove browser-only save adapter is not used and legacy progress is preserved
        run: node tools/cloud_recovery_v1/check.cjs
      - uses: actions/checkout@v4
        with:
          repository: FFDevelopment/afewbuds-beta
          ref: 2284aa779b8bb6001127ef263b8591dae8e83b40
          path: tester-phone
          persist-credentials: false
      - name: Verify identical protected phone beta cloud protocol
        run: |
          cmp shared/afb-cloud.js tester-phone/shared/afb-cloud.js
          cd tester-phone && node tools/shared_save_test.cjs
      - name: Reconstruct patched development game
        run: python3 tools/mobile_3d_movement/build.py --output-dir "${RUNNER_TEMP}/afb"
      - name: Validate cache-busted release ID and server-backed script tags
        run: python3 tools/mobile_3d_movement/check_release_stamp.py
      - name: Install Godot
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Verify the complete game and preservation of property equipment
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "${GODOT}" --headless --path "${RUNNER_TEMP}/afb/candidate" --editor --import --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/import.log;then exit 1;fi
          for spec in "tools/mobile_3d_movement/check.gd|MOBILE_3D_TEST_RESULT: PASS" "tools/dynamic_property_v1/check.gd|DYNAMIC_PROPERTY_REGISTRY_RESULT: PASS" "tools/item_registry_v1/check.gd|ITEM_REGISTRY_RESULT: PASS" "tools/property_isolation_v1/check.gd|PROPERTY_ISOLATION_RESULT: PASS" "tools/reward_contact_v1/check.gd|REWARD_CONTACT_RESULT: PASS" "tools/inventory_v1/check.gd|INVENTORY_TEST_RESULT: PASS" "tools/equipment_v2/check.gd|EQUIPMENT_V2_RESULT: PASS"; do
            script="${spec%%|*}"; marker="${spec#*|}"
            XDG_DATA_HOME="$(mktemp -d)" timeout 180s "${GODOT}" --headless --path "${RUNNER_TEMP}/afb/candidate" --script "${GITHUB_WORKSPACE}/${script}" 2>&1 | tee /tmp/game.log
            grep -q "${marker}" /tmp/game.log
            if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/game.log;then exit 1;fi
          done
