name: Patch spawn and inventory UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-spawn-inventory.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch PCK main script
        shell: python
        run: |
          from pathlib import Path
          import struct, hashlib, re

          P=Path("index-accountsync11.pck")
          blob=bytearray(P.read_bytes())
          if blob[:4] != b"GDPC":
              raise SystemExit("not pck")

          fb=struct.unpack_from("<Q",blob,24)[0]
          do=struct.unpack_from("<Q",blob,32)[0]
          count=struct.unpack_from("<I",blob,do)[0]
          pos=do+4
          entries=[]
          for _ in range(count):
              plen=struct.unpack_from("<I",blob,pos)[0]; pos+=4
              raw=bytes(blob[pos:pos+plen]); pos+=plen
              name=raw.rstrip(b"\0").decode()
              off=struct.unpack_from("<Q",blob,pos)[0]; pos+=8
              size=struct.unpack_from("<Q",blob,pos)[0]; pos+=8
              md5pos=pos
              md5=bytes(blob[pos:pos+16]); pos+=16
              flags=struct.unpack_from("<I",blob,pos)[0]; pos+=4
              entries.append((name,off,size,md5pos))

          target=next(x for x in entries if x[0]=="scripts/main.gd")
          name,off,size,md5pos=target
          start=fb+off
          raw=bytes(blob[start:start+size])
          text=raw.decode("utf-8").rstrip(" \n\0")

          # 1) Resume by room only. Never restore a close-up/station camera.
          pat=r'func _restore_runtime_state\(\) -> void:\n.*?(?=\nfunc )'
          m=re.search(pat,text,re.S)
          if not m:
              raise SystemExit("restore function missing")
          old=m.group(0)
          # Preserve timer/customer restoration by changing only the saved-view section.
          old_view='''\tcurrent_room = str(restored_runtime.get("current_room", "main"))
\troom_ring = grow_room_ring if current_room == "grow" else main_room_ring
\tvar saved_view: String = _safe_resume_view(str(restored_runtime.get("current_view", "main_grow_door")), current_room)
\tif views.has(saved_view):
\t\t_go_to_view(saved_view, false)
\telse:
\t\tcurrent_room = "main"
\t\troom_ring = main_room_ring
\t\t_go_to_view("main_grow_door", false)
'''
          if old_view not in old:
              old_view='''\tcurrent_room = str(restored_runtime.get("current_room", "main"))
\troom_ring = grow_room_ring if current_room == "grow" else main_room_ring
\tvar saved_view: String = str(restored_runtime.get("current_view", "main_grow_door"))
\tif views.has(saved_view):
\t\t_go_to_view(saved_view, false)
'''
          new_view='''\tcurrent_room = "grow" if str(restored_runtime.get("current_room", "main")) == "grow" else "main"
\troom_ring = grow_room_ring if current_room == "grow" else main_room_ring
\t_go_to_view("grow_room_tent" if current_room == "grow" else "main_grow_door", false)
'''
          if old_view not in old:
              raise SystemExit("restore view block missing")
          old=old.replace(old_view,new_view,1)
          text=text[:m.start()]+old+text[m.end():]

          # Also save only a normal room view.
          cap='''\t\t"current_view": _safe_resume_view(current_view, current_room),
\t\t"current_room": current_room,
'''
          if cap in text:
              text=text.replace(cap,'''\t\t"current_view": "grow_room_tent" if current_room == "grow" else "main_grow_door",
\t\t"current_room": current_room,
''',1)
          else:
              cap2='''\t\t"current_view": current_view,
\t\t"current_room": current_room,
'''
              if cap2 in text:
                  text=text.replace(cap2,'''\t\t"current_view": "grow_room_tent" if current_room == "grow" else "main_grow_door",
\t\t"current_room": current_room,
''',1)

          # 2) Build BAG button directly in main HUD.
          if 'var backpack_quick_button: Button' not in text:
              text=text.replace('var back_button: Button\n','var back_button: Button\nvar backpack_quick_button: Button\n',1)

          build_marker='''\tforward_button = Button.new()
\tforward_button.visible = false
\thud.add_child(forward_button)
'''
          bag_build='''\tforward_button = Button.new()
\tforward_button.visible = false
\thud.add_child(forward_button)

\tbackpack_quick_button = Button.new()
\tbackpack_quick_button.text = "BAG"
\tbackpack_quick_button.tooltip_text = "Open backpack"
\tbackpack_quick_button.set_anchors_preset(Control.PRESET_BOTTOM_RIGHT)
\tbackpack_quick_button.offset_left = -112
\tbackpack_quick_button.offset_top = -112
\tbackpack_quick_button.offset_right = -20
\tbackpack_quick_button.offset_bottom = -20
\tbackpack_quick_button.custom_minimum_size = Vector2(92, 92)
\tbackpack_quick_button.z_index = 200
\tbackpack_quick_button.add_theme_font_size_override("font_size", 18)
\tbackpack_quick_button.add_theme_stylebox_override("normal", _style_box(Color("183221"), Color("83c978"), 18, 3))
\tbackpack_quick_button.add_theme_stylebox_override("hover", _style_box(Color("24472f"), Color("a0e292"), 18, 3))
\tbackpack_quick_button.pressed.connect(_open_backpack_direct)
\thud.add_child(backpack_quick_button)
\thud.move_child(backpack_quick_button, hud.get_child_count() - 1)
'''
          if build_marker not in text:
              raise SystemExit("HUD build marker missing")
          text=text.replace(build_marker,bag_build,1)

          # Direct backpack panel fallback implemented in main script.
          if 'func _open_backpack_direct() -> void:' not in text:
              marker='func _build_phone_panel() -> void:\n'
              if marker not in text:
                  raise SystemExit("phone marker missing")
              funcs='''func _open_backpack_direct() -> void:
\tif personal_inventory != null and personal_inventory.has_method("toggle_backpack"):
\t\tpersonal_inventory.call("toggle_backpack")
\t\treturn
\tstatus_label.text = "Backpack inventory is unavailable in this build."

'''
              text=text.replace(marker,funcs+marker,1)

          # Keep BAG visible even if world controls are hidden/re-shown.
          vis_pat=r'func _set_world_controls_visible\(visible: bool\) -> void:\n.*?(?=\nfunc )'
          vm=re.search(vis_pat,text,re.S)
          if vm:
              block=vm.group(0)
              if 'backpack_quick_button.visible = true' not in block:
                  block += '\tif backpack_quick_button != null:\n\t\tbackpack_quick_button.visible = true\n'
                  text=text[:vm.start()]+block+text[vm.end():]

          data=text.encode()
          if len(data)>size:
              # Remove comments/extra blank lines only.
              lines=text.splitlines(True)
              lines=[ln for ln in lines if not ln.lstrip().startswith("#")]
              text="".join(lines)
              text=re.sub(r'\n{3,}','\n\n',text)
              data=text.encode()
          if len(data)>size:
              raise SystemExit(f"patched main too large {len(data)} > {size}")

          padded=data+b"\n"+b" "*(size-len(data)-1)
          blob[start:start+size]=padded
          blob[md5pos:md5pos+16]=hashlib.md5(padded).digest()
          P.write_bytes(blob)

          print("patched bytes",len(data),"slot",size)
          print("spawn room-only =>", '"grow_room_tent" if current_room == "grow" else "main_grow_door"' in text)
          print("bag direct =>", 'backpack_quick_button.text = "BAG"' in text)

      - name: Bump test version
        shell: python
        run: |
          from pathlib import Path
          import json
          p=Path("version.json")
          data=json.loads(p.read_text())
          data["release_id"]="0.7.9-beta.19-cloudtest.2"
          p.write_text(json.dumps(data,indent=2)+"\n")
          idx=Path("index.html")
          s=idx.read_text()
          s=s.replace("0.7.9-beta.19-cloudtest.1","0.7.9-beta.19-cloudtest.2")
          idx.write_text(s)

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-accountsync11.pck index.html version.json
          git commit -m "Fix room resume and force backpack HUD button"
          git push origin HEAD:main
