name: Bootstrap standalone cloud test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-cloud-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull current AFewBuds test runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/FFDevelopment/afewbuds-beta/main/cloud-test"
          files=(
            "index.html"
            "index-accountsync10.js"
            "index-accountsync11.pck"
            "index.wasm"
            "index.audio.worklet.js"
            "index.audio.position.worklet.js"
            "index.icon.png"
            "index.apple-touch-icon.png"
            "index.png"
            "index.manifest.json"
            "index.144x144.png"
            "index.180x180.png"
            "index.192x192.png"
            "index.512x512.png"
            "shared/config.js"
            "shared/afb-api.js"
            "shared/afb-cloud-accountsync10.js"
            "shared/afb-tracker.js"
            "shared/style.css"
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            curl --fail --location --retry 3 "$BASE/$file" --output "$file"
          done

      - name: Convert launcher to isolated test mode
        shell: python
        run: |
          from pathlib import Path
          import json, re

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")

          # Remove the temporary cache-clearing bootstrap that was only needed
          # while cloud-test lived under the stable site's service-worker scope.
          text = re.sub(
              r'<script>\s*\(async function\(\)\{.*?AFB cloud-test cleanup.*?</script>\s*',
              '',
              text,
              count=1,
              flags=re.S,
          )

          # This repository is intentionally a direct test launcher: no Godot
          # service worker and no transactional release rollback cache.
          text = text.replace('"serviceWorker":"index.service.worker.js"', '"serviceWorker":""')
          text = text.replace(
              '<title>AFewBuds 0.7.9-beta.19</title>',
              '<title>AFewBuds Cloud Test 0.7.9-beta.19</title>',
          )
          index.write_text(text, encoding="utf-8")

          updater = Path("shared/afb-updater.js")
          updater.write_text("""(function(){
            'use strict';
            window.AFB_UPDATER = {
              boot: async function(){
                var overlay = document.getElementById('afb-prelaunch');
                if (overlay) overlay.hidden = true;
              },
              rollback: async function(){ return false; },
              notifyGameStarting: function(){},
              markGameReady: function(){},
              markGameFailure: function(){},
              getState: function(){ return {}; },
              getLiveVersion: function(){ return null; }
            };
          })();
          """, encoding="utf-8")

          manifest = Path("index.manifest.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          data["name"] = "AFewBuds Cloud Test"
          data["short_name"] = "AFB Test"
          data["start_url"] = "./index.html"
          manifest.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          Path(".nojekyll").write_text("", encoding="utf-8")
          Path("BUILD_VERSION.txt").write_text(
              "AFewBuds Cloud Test\n"
              "Game build: 0.7.9-beta.19\n"
              "Test pack: index-accountsync11.pck\n"
              "Standalone test channel: no stable updater/service-worker cache\n",
              encoding="utf-8",
          )

      - name: Commit standalone runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Standalone runtime already current."
          else
            git commit -m "Import standalone AFewBuds cloud-test runtime [skip bootstrap]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
