name: Apply cloudtest40 phone leaderboard
on:
  push:
    branches: [main]
    paths:
      - "tools/patch_cloudtest40_leaderboard.py"
      - ".github/workflows/apply-cloudtest40-leaderboard.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudtest40-leaderboard
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply isolated phone leaderboard patch
        run: python tools/patch_cloudtest40_leaderboard.py
      - name: Commit cloudtest40 runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-cloudtest10.pck index.html version.json
          if git diff --cached --quiet; then
            echo "No cloudtest40 runtime changes."
          else
            git commit -m "Publish cloudtest40 phone leaderboard runtime"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
