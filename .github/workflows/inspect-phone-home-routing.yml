name: Inspect phone home routing
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-phone-home-routing.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect phone home and routing
        shell: python
        run: |
          from pathlib import Path
          import struct,re
          b=Path("index-cloudtest23.pck").read_bytes()
          fb=struct.unpack_from("<Q",b,24)[0]; do=struct.unpack_from("<Q",b,32)[0]
          n=struct.unpack_from("<I",b,do)[0]; p=do+4; main=""
          for _ in range(n):
              q=struct.unpack_from("<I",b,p)[0]; p+=4
              name=b[p:p+q].rstrip(b"\0").decode(); p+=q
              off=struct.unpack_from("<Q",b,p)[0]; p+=8
              size=struct.unpack_from("<Q",b,p)[0]; p+=8
              p+=20
              if name=="scripts/main.gd":
                  main=b[fb+off:fb+off+size].decode("utf-8","replace").rstrip(" \n\0")
                  break
          def fn(name):
              m=re.search(r'^func '+re.escape(name)+r'\([^\n]*\)(?: -> [^:]+)?:\n.*?(?=^func |\Z)',main,re.M|re.S)
              return m.group(0).rstrip() if m else "<MISSING>"
          for name in ["_build_phone_home","_phone_parent_app","_phone_open_app","_open_phone_app","_add_phone_app_button","_add_phone_dock_button","_build_shop_app","_build_business_app"]:
              print("\n===== "+name+" =====")
              print(fn(name))
          print("\n===== FUNCTIONS CONTAINING phone_current_app =====")
          for m in re.finditer(r'^func ([A-Za-z0-9_]+)\([^\n]*\)(?: -> [^:]+)?:\n.*?(?=^func |\Z)',main,re.M|re.S):
              block=m.group(0)
              if "phone_current_app" in block:
                  print("\n--- "+m.group(1)+" ---")
                  print(block)
