name: Compare cloudtest9 runtime
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/compare-cloudtest9.yml"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cloud
      - uses: actions/checkout@v4
        with:
          repository: FFDevelopment/afewbuds-beta
          ref: main
          path: stable
      - name: Compare resume code
        shell: python
        run: |
          from pathlib import Path
          import struct,re,difflib
          def main_text(path):
              b=Path(path).read_bytes()
              fb=struct.unpack_from("<Q",b,24)[0]
              do=struct.unpack_from("<Q",b,32)[0]
              n=struct.unpack_from("<I",b,do)[0]
              p=do+4
              for _ in range(n):
                  plen=struct.unpack_from("<I",b,p)[0]; p+=4
                  name=b[p:p+plen].rstrip(b"\0").decode(); p+=plen
                  off=struct.unpack_from("<Q",b,p)[0]; p+=8
                  size=struct.unpack_from("<Q",b,p)[0]; p+=8
                  p+=20
                  if name=="scripts/main.gd":
                      return b[fb+off:fb+off+size].decode("utf-8","replace").rstrip(" \n\0")
              raise RuntimeError("main missing")
          def func(text,name):
              m=re.search(r'^func '+re.escape(name)+r'\([^\n]*\)(?: -> [^:]+)?:\n.*?(?=^func |\Z)',text,re.M|re.S)
              return m.group(0).rstrip() if m else "<MISSING>"
          s=main_text("stable/index-accountsync10.pck")
          c=main_text("cloud/index-cloudtest9.pck")
          for name in ["_ready","_load_game","_save_game","_capture_runtime_state","_restore_runtime_state","_go_to_view","_pause_gameplay","_resume_gameplay"]:
              print("\n===== "+name+" =====")
              a=func(s,name).splitlines(); b=func(c,name).splitlines()
              diff=list(difflib.unified_diff(a,b,fromfile="stable",tofile="cloud9",lineterm=""))
              print("\n".join(diff) if diff else "IDENTICAL")
          print("\nSTALE OVERRIDE", 'create_timer(0.12).timeout.connect(_go_to_view.bind' in c)

          def extract_file(path,target):
              b=Path(path).read_bytes()
              fb=struct.unpack_from("<Q",b,24)[0]
              do=struct.unpack_from("<Q",b,32)[0]
              n=struct.unpack_from("<I",b,do)[0]
              p=do+4
              for _ in range(n):
                  plen=struct.unpack_from("<I",b,p)[0]; p+=4
                  name=b[p:p+plen].rstrip(b"\0").decode(); p+=plen
                  off=struct.unpack_from("<Q",b,p)[0]; p+=8
                  size=struct.unpack_from("<Q",b,p)[0]; p+=8
                  p+=20
                  if name==target:
                      return b[fb+off:fb+off+size].decode("utf-8","replace").rstrip(" \n\0")
              return "<MISSING>"
          print("\n===== CLOUD PERSONAL INVENTORY =====")
          print(extract_file("cloud/index-cloudtest9.pck","scripts/personal_inventory.gd"))
