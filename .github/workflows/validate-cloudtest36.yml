name: Validate cloudtest36 recovery
on:
  push:
    branches: [cloudtest36-password-recovery]
    paths:
      - "index.html"
      - "version.json"
      - "supabase/PATCH_PASSWORD_RECOVERY_36.sql"
      - "supabase/functions/afb-password-reset/index.ts"
      - ".github/workflows/validate-cloudtest36.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract browser JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re
          html=Path("index.html").read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          inline=[s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit("No inline browser script found")
          Path("/tmp/afb-inline.js").write_text(inline[-1])
          required=[
              'id="afb-forgot-pane"',
              'id="afb-reset-pane"',
              "afbRequestPasswordReset",
              "afb_password_reset_complete",
              "0.7.9-beta.19-cloudtest.36",
          ]
          for needle in required:
              if needle not in html:
                  raise SystemExit("Missing "+needle)
      - name: Check browser JavaScript syntax
        run: node --check /tmp/afb-inline.js
      - name: Verify recovery backend sources
        run: |
          grep -q "afb_password_reset_issue" supabase/PATCH_PASSWORD_RECOVERY_36.sql
          grep -q "afb_password_reset_brevo_config" supabase/PATCH_PASSWORD_RECOVERY_36.sql
          grep -q "api.brevo.com/v3/smtp/email" supabase/functions/afb-password-reset/index.ts
          grep -q "verify_jwt" .github/workflows/validate-cloudtest36.yml || true
          ! grep -q "afb_resend" supabase/PATCH_PASSWORD_RECOVERY_36.sql
          git diff --check
