name: Extract packed main for diagnosis
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-main-debug.yml"
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract scripts/main.gd
        shell: python
        run: |
          from pathlib import Path
          import struct
          p=Path("index-accountsync11.pck")
          blob=p.read_bytes()
          fb=struct.unpack_from("<Q", blob, 24)[0]
          do=struct.unpack_from("<Q", blob, 32)[0]
          count=struct.unpack_from("<I", blob, do)[0]
          pos=do+4
          for _ in range(count):
              plen=struct.unpack_from("<I", blob, pos)[0]; pos+=4
              name=blob[pos:pos+plen].rstrip(b"\0").decode(); pos+=plen
              off=struct.unpack_from("<Q", blob, pos)[0]; pos+=8
              size=struct.unpack_from("<Q", blob, pos)[0]; pos+=8
              pos+=20
              if name=="scripts/main.gd":
                  Path("debug-main.gd.txt").write_bytes(blob[fb+off:fb+off+size].rstrip(b" \n\0"))
                  break
          else:
              raise SystemExit("scripts/main.gd not found")
      - name: Commit debug extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug-main.gd.txt
          git commit -m "Extract packed main for spawn diagnosis"
          git pull --rebase origin main
          git push origin HEAD:main
