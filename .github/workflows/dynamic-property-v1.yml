name: Validate shared property core - mobile
on:
  push:
    branches: [feature/dynamic-property-registry-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  property-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned canonical shared module
        uses: actions/checkout@v4
        with:
          repository: FFDevelopment/afewbuds-3d-prototype
          ref: 8dc49a4815e4a893d0f7b47394b554eaa1ba08e0
          path: afb-shared-core
          persist-credentials: false
      - name: Ensure mobile and desktop share identical property logic
        run: cmp tools/dynamic_property_v1/property_registry.gd afb-shared-core/game/scripts/property_registry.gd
      - name: Assemble mobile gameplay candidate
        run: python3 tools/mobile_3d_movement/build.py --output-dir "${RUNNER_TEMP}/dynamic-property"
      - name: Install Godot 4.7.2
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Import gameplay candidate and verify scripts
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path "${RUNNER_TEMP}/dynamic-property/candidate" --editor --import --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/import.log; then exit 1; fi
      - name: Test old careers and independent new property records
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          for spec in "tools/dynamic_property_v1/check.gd|DYNAMIC_PROPERTY_REGISTRY_RESULT: PASS" "tools/property_isolation_v1/check.gd|PROPERTY_ISOLATION_RESULT: PASS" "tools/mobile_3d_movement/check.gd|MOBILE_3D_TEST_RESULT: PASS" "tools/progression_v1/check.gd|PROGRESSION_V1_TEST_RESULT: PASS" "tools/reward_contact_v1/check.gd|REWARD_CONTACT_RESULT: PASS" "tools/inventory_v1/check.gd|INVENTORY_TEST_RESULT: PASS" "tools/equipment_v2/check.gd|EQUIPMENT_V2_RESULT: PASS"; do
            script="${spec%%|*}"
            marker="${spec#*|}"
            XDG_DATA_HOME="$(mktemp -d)" timeout 180s "${GODOT}" --headless --path "${RUNNER_TEMP}/dynamic-property/candidate" --script "${GITHUB_WORKSPACE}/${script}" 2>&1 | tee /tmp/game-test.log
            grep -q "${marker}" /tmp/game-test.log
            if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/game-test.log; then exit 1; fi
          done
