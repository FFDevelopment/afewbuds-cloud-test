name: House Stairwell Render Diagnostics
on:
  push:
    branches: [main]
    paths:
      - tools/map_integration_v1/stairwell_inventory.gd
      - .github/workflows/house-stair-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact mobile runtime
        run: python3 tools/mobile_3d_movement/build.py --output-dir "${RUNNER_TEMP}/candidate"
      - name: Install Godot
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Inspect house-view render geometry
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path "${RUNNER_TEMP}/candidate/candidate" --editor --import --quit
          timeout 65s "$GODOT" --headless --path "${RUNNER_TEMP}/candidate/candidate" --script "${GITHUB_WORKSPACE}/tools/map_integration_v1/stairwell_inventory.gd" 2>&1 | tee "${RUNNER_TEMP}/stair-render.log"
          grep -q 'STAIR_RENDER_DIAG_COMPLETE' "${RUNNER_TEMP}/stair-render.log"
      - name: Capture rendered stairwell with OpenGL / Xvfb
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          if ! command -v xvfb-run; then sudo apt-get update -qq && sudo apt-get install -y xvfb; fi
          timeout 95s xvfb-run -a -s '-screen 0 1280x900x24' "$GODOT" --rendering-method gl_compatibility --rendering-driver opengl3 --path "${RUNNER_TEMP}/candidate/candidate" --script "${GITHUB_WORKSPACE}/tools/map_integration_v1/stairwell_capture.gd" 2>&1 | tee "${RUNNER_TEMP}/stair-capture.log"
          grep -q 'STAIR_JPEG_END' "${RUNNER_TEMP}/stair-capture.log"
