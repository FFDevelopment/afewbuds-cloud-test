name: Deploy exact public beta4 baseline with tested fixes

on:
  push:
    branches: [experiment/container-inventory]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/public-beta4-plus-fixes
          fetch-depth: 0

      - name: Build mobile 3D runtime
        run: |
          set -euo pipefail
          python3 tools/mobile_3d_movement/build.py --output-dir "${RUNNER_TEMP}/mobile3d"

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot

      - name: Import candidate and test CharacterBody3D movement
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "${GODOT}" --headless --path "${RUNNER_TEMP}/mobile3d/candidate" --editor --import --quit
          XDG_DATA_HOME="$(mktemp -d)" timeout 180s "${GODOT}" --headless --path "${RUNNER_TEMP}/mobile3d/candidate" --script "${GITHUB_WORKSPACE}/tools/mobile_3d_movement/check.gd" 2>&1 | tee "${RUNNER_TEMP}/mobile3d-check.log"
          grep -q "MOBILE_3D_TEST_RESULT: PASS" "${RUNNER_TEMP}/mobile3d-check.log"
          if grep -E 'SCRIPT ERROR|^ERROR:' "${RUNNER_TEMP}/mobile3d-check.log"; then exit 1; fi
          XDG_DATA_HOME="$(mktemp -d)" timeout 120s "${GODOT}" --headless --path "${RUNNER_TEMP}/mobile3d/candidate" --script "${GITHUB_WORKSPACE}/tools/progression_v1/check.gd" 2>&1 | tee "${RUNNER_TEMP}/progression-v1-check.log"
          grep -q "PROGRESSION_V1_TEST_RESULT: PASS" "${RUNNER_TEMP}/progression-v1-check.log"
          if grep -E 'SCRIPT ERROR|^ERROR:' "${RUNNER_TEMP}/progression-v1-check.log"; then exit 1; fi

      - name: Test containers and shared cloud career handoff
        run: |
          set -euo pipefail
          node tools/inventory_v1/save_test.cjs
          XDG_DATA_HOME="$(mktemp -d)" timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path "${RUNNER_TEMP}/mobile3d/candidate" --script "${GITHUB_WORKSPACE}/tools/inventory_v1/check.gd" 2>&1 | tee "${RUNNER_TEMP}/inventory-check.log"
          grep -q "INVENTORY_TEST_RESULT: PASS" "${RUNNER_TEMP}/inventory-check.log"
          if grep -E 'SCRIPT ERROR|^ERROR:' "${RUNNER_TEMP}/inventory-check.log"; then exit 1; fi

      - name: Test shop pickup and backpack weight
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$(mktemp -d)" timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path "${RUNNER_TEMP}/mobile3d/candidate" --script "${GITHUB_WORKSPACE}/tools/inventory_v1/shop_check.gd" 2>&1 | tee "${RUNNER_TEMP}/shop-inventory-check.log"
          grep -q "SHOP_INVENTORY_TEST_RESULT: PASS" "${RUNNER_TEMP}/shop-inventory-check.log"
          if grep -E 'SCRIPT ERROR|^ERROR:' "${RUNNER_TEMP}/shop-inventory-check.log"; then exit 1; fi

      - name: Test packing workflow and station UI
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$(mktemp -d)" timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path "${RUNNER_TEMP}/mobile3d/candidate" --script "${GITHUB_WORKSPACE}/tools/inventory_v1/station_check.gd" 2>&1 | tee "${RUNNER_TEMP}/station-inventory-check.log"
          grep -q "STATION_INVENTORY_TEST_RESULT: PASS" "${RUNNER_TEMP}/station-inventory-check.log"
          if grep -E 'SCRIPT ERROR|^ERROR:' "${RUNNER_TEMP}/station-inventory-check.log"; then exit 1; fi

      - name: Test backpack use, packing upgrades and computer touch menus
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$(mktemp -d)" timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path "${RUNNER_TEMP}/mobile3d/candidate" --script "${GITHUB_WORKSPACE}/tools/inventory_v1/release_check.gd" 2>&1 | tee "${RUNNER_TEMP}/release-check.log"
          grep -q "RELEASE_READINESS_TEST_RESULT: PASS" "${RUNNER_TEMP}/release-check.log"
          if grep -E 'SCRIPT ERROR|^ERROR:' "${RUNNER_TEMP}/release-check.log"; then exit 1; fi

      - name: Test tutorial, market categories and weight-limited collection
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$(mktemp -d)" timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path "${RUNNER_TEMP}/mobile3d/candidate" --script "${GITHUB_WORKSPACE}/tools/inventory_v1/tutorial_market_check.gd" 2>&1 | tee "${RUNNER_TEMP}/tutorial-market-check.log"
          grep -q "TUTORIAL_MARKET_TEST_RESULT: PASS" "${RUNNER_TEMP}/tutorial-market-check.log"
          if grep -E 'SCRIPT ERROR|^ERROR:' "${RUNNER_TEMP}/tutorial-market-check.log"; then exit 1; fi

      - name: Test pause menus, interaction styling and save-before-quit
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$(mktemp -d)" timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path "${RUNNER_TEMP}/mobile3d/candidate" --script "${GITHUB_WORKSPACE}/tools/inventory_v1/session_check.gd" 2>&1 | tee "${RUNNER_TEMP}/session-check.log"
          grep -q "SESSION_UI_TEST_RESULT: PASS" "${RUNNER_TEMP}/session-check.log"
          if grep -E 'SCRIPT ERROR|^ERROR:' "${RUNNER_TEMP}/session-check.log"; then exit 1; fi

      - name: Test equipment items, migrations, delivery and empty-before-moving safety
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$(mktemp -d)" timeout 150s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path "${RUNNER_TEMP}/mobile3d/candidate" --script "${GITHUB_WORKSPACE}/tools/equipment_v2/check.gd" 2>&1 | tee "${RUNNER_TEMP}/equipment-check.log"
          grep -q "EQUIPMENT_V2_RESULT: PASS" "${RUNNER_TEMP}/equipment-check.log"
          if grep -E 'SCRIPT ERROR|^ERROR:' "${RUNNER_TEMP}/equipment-check.log"; then exit 1; fi

      - name: Test expansion and isolated test saves
        run: |
          set -euo pipefail
          node tools/expansion_v1/save_test.cjs
          XDG_DATA_HOME="$(mktemp -d)" timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path "${RUNNER_TEMP}/mobile3d/candidate" --script "${GITHUB_WORKSPACE}/tools/expansion_v1/expansion_test.gd" 2>&1 | tee "${RUNNER_TEMP}/expansion-check.log"
          grep -q "EXPANSION_TEST_RESULT: PASS" "${RUNNER_TEMP}/expansion-check.log"
          if grep -E 'SCRIPT ERROR|^ERROR:' "${RUNNER_TEMP}/expansion-check.log"; then exit 1; fi

      - name: Commit validated inventory preview
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/mobile-3d-v1.patch.json shared/afb-runtime-mobile-3d-v1.js index.html version.json BUILD_VERSION.txt tools/mobile_3d_movement/build_receipt.json
          if ! git diff --cached --quiet; then
            git commit -m "Build validated inventory preview"
            git fetch origin recovery/public-beta4-plus-fixes
            git rebase origin/recovery/public-beta4-plus-fixes
            git push origin HEAD:recovery/public-beta4-plus-fixes
          fi

      - name: Verify public property and worker isolation
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$(mktemp -d)" timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path "${RUNNER_TEMP}/mobile3d/candidate" --script "${GITHUB_WORKSPACE}/tools/property_isolation_v1/check.gd" 2>&1 | tee "${RUNNER_TEMP}/property-check.log"
          grep -q "PROPERTY_ISOLATION_RESULT: PASS" "${RUNNER_TEMP}/property-check.log"
          if grep -E 'SCRIPT ERROR|^ERROR:' "${RUNNER_TEMP}/property-check.log"; then exit 1; fi

      - name: Checkout immutable public beta.4 launcher, UI and assets
        uses: actions/checkout@v4
        with:
          repository: FFDevelopment/afewbuds-beta
          ref: 16a0d3db84e594a9e3538869e539947979259fc3
          path: public-baseline
          persist-credentials: false

      - name: Stage exact public beta launcher with verified updated game
        run: |
          set -euo pipefail
          python3 tools/public_beta_parity/stage.py --public public-baseline --candidate "${RUNNER_TEMP}/mobile3d/candidate.pck" --output "${RUNNER_TEMP}/afb-public-copy"
          mkdir -p "${RUNNER_TEMP}/afb-pages"
          cp -a "${RUNNER_TEMP}/afb-public-copy/." "${RUNNER_TEMP}/afb-pages/"
          mkdir -p "${RUNNER_TEMP}/afb-pages/inventory-preview"
          cp -a "${RUNNER_TEMP}/afb-public-copy/." "${RUNNER_TEMP}/afb-pages/inventory-preview/"
          echo 'Public beta shell and original walk-around editor verified before Pages upload.'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/afb-pages
  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy isolated preview alongside main
        id: deployment
        uses: actions/deploy-pages@v4
