name: Build mobile baseline

on:
  push:
    branches: [main, feature/friend-characters-20261010, feature/door-staff-substitutions-20261010, feature/house-npc-paths-v1, feature/door-dealer-natural-movement-20261010, feature/pause-graphics-presets-20261010, fix/starter-landing-collision-unstuck-20261011, feature/player-avatar-creator-v1-20261011, fix/avatar-preview-invisible-20261011, fix/avatar-ios-native-rig-20261011, feature/avatar-art-v2-tailored-20261011, hotfix/house-furniture-dev-parity-20261011, feature/placed-equipment-upgrades-and-tight-fit-20261011, feature/production-staff-unlocks-bench-fit-20261011, fix/house-packing-bench-flush-20261011, hotfix/house-physical-room-bounds-20261011, hotfix/testers-house-packing-basement-parity-20261011]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-baseline-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Build mobile 3D runtime
        run: |
          set -euo pipefail
          python3 tools/mobile_3d_movement/build.py --output-dir "${RUNNER_TEMP}/mobile3d"

      - name: Verify browser and in-game release identity
        run: python3 tools/mobile_3d_movement/check_release_stamp.py

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot

      - name: Import candidate and test CharacterBody3D movement
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "${GODOT}" --headless --path "${RUNNER_TEMP}/mobile3d/candidate" --editor --import --quit
          timeout 180s "${GODOT}" --headless --path "${RUNNER_TEMP}/mobile3d/candidate" --script "${GITHUB_WORKSPACE}/tools/mobile_3d_movement/check.gd" 2>&1 | tee "${RUNNER_TEMP}/mobile3d-check.log"
          grep -q "MOBILE_3D_TEST_RESULT: PASS" "${RUNNER_TEMP}/mobile3d-check.log"
          if grep -E 'SCRIPT ERROR|^ERROR:' "${RUNNER_TEMP}/mobile3d-check.log"; then exit 1; fi
          timeout 120s "${GODOT}" --headless --path "${RUNNER_TEMP}/mobile3d/candidate" --script "${GITHUB_WORKSPACE}/tools/progression_v1/check.gd" 2>&1 | tee "${RUNNER_TEMP}/progression-v1-check.log"
          grep -q "PROGRESSION_V1_TEST_RESULT: PASS" "${RUNNER_TEMP}/progression-v1-check.log"
          if grep -E 'SCRIPT ERROR|^ERROR:' "${RUNNER_TEMP}/progression-v1-check.log"; then exit 1; fi

      - name: Test property ownership, inventory, Reeves and gameplay safety
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          for spec in "tools/avatar_creator_v1/check.gd|AVATAR_CREATOR_RESULT: PASS" "tools/landing_unstuck_hotfix_v1/check.gd|LANDING_UNSTUCK_RESULT: PASS" "tools/graphics_presets_v1/check.gd|GRAPHICS_PRESETS_RESULT: PASS" "tools/door_movement_v1/check.gd|HOUSE_DOOR_MOTION_RESULT: PASS" "tools/house_npc_nav_v1/check.gd|HOUSE_NPC_NAV_RESULT: PASS" "tools/door_staff_v1/check.gd|DOOR_STAFF_RESULT: PASS" "tools/production_actions_v1/check.gd|PRODUCTION_ACTIONS_TEST_RESULT: PASS" "tools/friend_characters_v1/check.gd|ASSETS_TEST_RESULT: PASS" "tools/property_worker_v1/check.gd|PROPERTY_PRODUCTION_STAFF_RESULT: PASS" "tools/tester_shop_v1/check.gd|TESTER_SHOP_HOTFIX_RESULT: PASS" "tools/map_integration_v1/cart_check.gd|MARKET_CART_RESULT: PASS" "tools/map_integration_v1/check.gd|MAP_INTEGRATION_RESULT: PASS" "tools/dynamic_property_v1/check.gd|DYNAMIC_PROPERTY_REGISTRY_RESULT: PASS" "tools/item_registry_v1/check.gd|ITEM_REGISTRY_RESULT: PASS" "tools/property_phone_v1/check.gd|PROPERTY_GAMEPLAY_RESULT: PASS" "tools/house_room_bounds_v1/check.gd|HOUSE_ROOM_BOUNDARIES_RESULT: PASS" "tools/house_packing_parity_v1/check.gd|HOUSE_PACKING_PARITY_RESULT: PASS" "tools/property_isolation_v1/check.gd|PROPERTY_ISOLATION_RESULT: PASS" "tools/reward_contact_v1/check.gd|REWARD_CONTACT_RESULT: PASS" "tools/inventory_v1/check.gd|INVENTORY_TEST_RESULT: PASS" "tools/equipment_v2/check.gd|EQUIPMENT_V2_RESULT: PASS"; do
            script="${spec%%|*}"
            marker="${spec#*|}"
            XDG_DATA_HOME="$(mktemp -d)" timeout 180s "${GODOT}" --headless --path "${RUNNER_TEMP}/mobile3d/candidate" --script "${GITHUB_WORKSPACE}/${script}" 2>&1 | tee /tmp/afb-game-check.log
            grep -q "${marker}" /tmp/afb-game-check.log
            if grep -E 'SCRIPT ERROR|^ERROR:' /tmp/afb-game-check.log; then exit 1; fi
          done

      - name: Commit validated baseline runtime
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/mobile-3d-v1.patch.json shared/afb-runtime-mobile-3d-v1.js index.html version.json BUILD_VERSION.txt tools/mobile_3d_movement/build_receipt.json
          if ! git diff --cached --quiet; then
            git commit -m "Build validated mobile baseline"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
