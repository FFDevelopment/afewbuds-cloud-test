name: Build cloudtest23 room hint spacing

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-cloudtest23.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build cloudtest23
        run: python tools/build_cloudtest23.py
      - name: Commit generated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-cloudtest23.pck index.html version.json
          git commit -m "Publish cloudtest23 room hint spacing"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy generated cloudtest23
        id: deployment
        uses: actions/deploy-pages@v4
