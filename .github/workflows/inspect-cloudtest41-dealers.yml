name: Inspect cloudtest41 dealer runtime
on:
  push:
    branches: [main]
    paths:
      - "tools/inspect_cloudtest41_dealers.py"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python tools/inspect_cloudtest41_dealers.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug-main.gd.txt debug-personal_inventory.gd.txt debug-touch_scroll.gd.txt debug-dealer-audit.txt
          git commit -m "Inspect cloudtest41 dealer and inventory runtime" || exit 0
          git pull --rebase origin main
          git push
