name: Inspect max heat consequences
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-max-heat-consequences.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current packed max heat logic
        shell: python
        run: |
          from pathlib import Path
          import struct,re
          b=Path("index-cloudtest10.pck").read_bytes()
          fb=struct.unpack_from("<Q",b,24)[0]; do=struct.unpack_from("<Q",b,32)[0]
          n=struct.unpack_from("<I",b,do)[0]; p=do+4; main=""
          for _ in range(n):
              q=struct.unpack_from("<I",b,p)[0]; p+=4
              name=b[p:p+q].rstrip(b"\0").decode(); p+=q
              off=struct.unpack_from("<Q",b,p)[0]; p+=8
              size=struct.unpack_from("<Q",b,p)[0]; p+=8
              p+=20
              if name=="scripts/main.gd":
                  main=b[fb+off:fb+off+size].decode("utf-8","replace").rstrip(" \n\0")
                  break
          pat=re.compile(r'^func ([A-Za-z0-9_]+)\([^\n]*\)(?: -> [^:]+)?:\n.*?(?=^func |\Z)',re.M|re.S)
          wanted=[]
          for m in pat.finditer(main):
              block=m.group(0)
              low=block.lower()
              if any(k in low for k in [
                  "enforcement_risk","raid","missed_payment","reeves_missed",
                  "heat >= 90","heat >= 100","critical","reeves_visit_pending",
                  "refuse","_check_reeves_trigger","_trigger_heat_threshold_event"
              ]):
                  wanted.append((m.group(1),block))
          for name,block in wanted:
              print("\n===== "+name+" =====")
              print(block)
