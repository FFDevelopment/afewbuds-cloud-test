name: Inspect heat pause logic
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-heat-pause.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect packed heat and pause functions
        shell: python
        run: |
          from pathlib import Path
          import struct,re
          b=Path("index-cloudtest10.pck").read_bytes()
          fb=struct.unpack_from("<Q",b,24)[0]; do=struct.unpack_from("<Q",b,32)[0]
          n=struct.unpack_from("<I",b,do)[0]; p=do+4; main=""
          for _ in range(n):
              q=struct.unpack_from("<I",b,p)[0]; p+=4
              name=b[p:p+q].rstrip(b"\0").decode(); p+=q
              off=struct.unpack_from("<Q",b,p)[0]; p+=8
              size=struct.unpack_from("<Q",b,p)[0]; p+=8
              p+=20
              if name=="scripts/main.gd":
                  main=b[fb+off:fb+off+size].decode("utf-8","replace").rstrip(" \n\0")
                  break
          def fn(name):
              m=re.search(r'^func '+re.escape(name)+r'\([^\n]*\)(?: -> [^:]+)?:\n.*?(?=^func |\Z)',main,re.M|re.S)
              return m.group(0).rstrip() if m else "<MISSING>"
          names=["_process","_physics_process","_add_heat","_decay_heat","_update_heat","_pause_gameplay","_resume_gameplay","_on_browser_pause","_capture_runtime_state","_restore_runtime_state","_apply_offline_progress","_apply_cloud_boot_save","_load_game","_save_game"]
          for name in names:
              print("\n===== "+name+" =====")
              print(fn(name))
          print("\n===== HEAT/TIME REFERENCES =====")
          for i,line in enumerate(main.splitlines(),1):
              low=line.lower()
              if "heat" in low or "unix" in low or "time.get" in low or "paused" in low:
                  if "color(" not in low:
                      print(i,line)
