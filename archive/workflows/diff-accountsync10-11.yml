name: Diff accountsync10 vs accountsync11
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diff-accountsync10-11.yml"
  workflow_dispatch:

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cloud-test
        uses: actions/checkout@v4
        with:
          path: cloud
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          repository: FFDevelopment/afewbuds-beta
          ref: main
          path: stable
      - name: Diff packed main scripts
        shell: python
        run: |
          from pathlib import Path
          import struct,re,difflib

          def extract(path,target="scripts/main.gd"):
              b=Path(path).read_bytes()
              fb=struct.unpack_from("<Q",b,24)[0]
              do=struct.unpack_from("<Q",b,32)[0]
              n=struct.unpack_from("<I",b,do)[0]
              p=do+4
              for _ in range(n):
                  plen=struct.unpack_from("<I",b,p)[0]; p+=4
                  name=b[p:p+plen].rstrip(b"\0").decode(); p+=plen
                  off=struct.unpack_from("<Q",b,p)[0]; p+=8
                  size=struct.unpack_from("<Q",b,p)[0]; p+=8
                  p+=20
                  if name==target:
                      return b[fb+off:fb+off+size].decode("utf-8","replace").rstrip(" \n\0")
              return "<MISSING>"

          a=extract("stable/index-accountsync10.pck")
          b=extract("cloud/index-accountsync11.pck")

          names=[
            "_ready","_load_game","_save_game","_capture_runtime_state",
            "_restore_runtime_state","_go_to_view","_sync_room_view_from_yaw",
            "_process","_input","_unhandled_input","_pause_gameplay",
            "_resume_gameplay","_install_lifecycle_hooks","_on_browser_pause",
            "_build_world","_build_ui"
          ]
          def func(text,name):
              m=re.search(r'^func '+re.escape(name)+r'\([^\n]*\)(?: -> [^:]+)?:\n.*?(?=^func |\Z)',text,re.M|re.S)
              return m.group(0).rstrip() if m else "<MISSING>"

          for name in names:
              aa=func(a,name).splitlines(); bb=func(b,name).splitlines()
              d=list(difflib.unified_diff(aa,bb,fromfile="main accountsync10",tofile="cloud base accountsync11",lineterm=""))
              if d:
                  print("\n===== "+name+" =====")
                  print("\n".join(d))

          # Print all top-level variable lines mentioning camera/room/view.
          for label,text in [("MAIN10",a),("CLOUD11",b)]:
              print("\n===== "+label+" CAMERA/ROOM VARS =====")
              for line in text.splitlines():
                  if line.startswith("var ") and any(k in line for k in ["camera","room_","current_view","current_room","view_"]):
                      print(line)
