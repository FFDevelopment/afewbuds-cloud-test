name: Build clean rollback cloudtest19

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-cloudtest19.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build from known-good cloudtest12
        shell: python
        run: |
          from pathlib import Path
          import struct,hashlib,re,json

          SRC=Path("index-cloudtest12.pck")
          OUT=Path("index-cloudtest19.pck")
          blob=SRC.read_bytes()
          fb=struct.unpack_from("<Q",blob,24)[0]
          do=struct.unpack_from("<Q",blob,32)[0]
          n=struct.unpack_from("<I",blob,do)[0]
          p=do+4
          entries=[]
          for _ in range(n):
              q=struct.unpack_from("<I",blob,p)[0]; p+=4
              name=blob[p:p+q].rstrip(b"\0").decode(); p+=q
              off=struct.unpack_from("<Q",blob,p)[0]; p+=8
              size=struct.unpack_from("<Q",blob,p)[0]; p+=8
              md5=blob[p:p+16]; p+=16
              flags=struct.unpack_from("<I",blob,p)[0]; p+=4
              data=blob[fb+off:fb+off+size]
              if hashlib.md5(data).digest()!=md5:
                  raise SystemExit("md5 mismatch "+name)
              entries.append([name,data,flags])

          for row in entries:
              if row[0]!="scripts/main.gd":
                  continue
              t=row[1].decode("utf-8","replace").rstrip(" \n\0")
              t=t.replace("CLOUD TEST .12","CLOUD TEST .19")

              # Do not initialize the unfinished personal inventory at startup.
              t=t.replace('\tcall_deferred("_init_personal_inventory_deferred")\n','',1)

              # Remove the visible BAG shortcut but keep the dormant inventory
              # code/functions packaged so there are no missing-script references.
              bag_ui=re.compile(
                  r'\n\tbackpack_quick_button = Button\.new\(\)\n.*?\n\thud\.move_child\(backpack_quick_button, hud\.get_child_count\(\) - 1\)\n',
                  re.S
              )
              t=bag_ui.sub('\n',t,count=1)

              # Never approach/open the locker while inventory is disabled.
              approach=re.compile(
                  r'^func _approach_station_then_open\(action_id: String\) -> bool:\n',
                  re.M
              )
              if not approach.search(t):
                  raise SystemExit("approach function missing")
              t=approach.sub(
                  'func _approach_station_then_open(action_id: String) -> bool:\n'
                  '\tif action_id == "station_locker":\n'
                  '\t\tstatus_label.text = "Locker storage is unavailable for now."\n'
                  '\t\treturn true\n',
                  t,
                  count=1
              )

              # If an older test save was left in the locker close-up, BACK works.
              t=t.replace(
                  '\t\t"workbench": _go_to_view("main_workbench")\n\t\t"storage": _go_to_view("main_storage")',
                  '\t\t"workbench": _go_to_view("main_workbench")\n'
                  '\t\t"locker": _go_to_view("main_workbench")\n'
                  '\t\t"storage": _go_to_view("main_storage")',
                  1
              )

              # Repair old saved locker view during restore so it cannot reopen stuck.
              restore_pat=re.compile(
                  r'^func _restore_runtime_state\(\) -> void:\n.*?(?=^func |\Z)',
                  re.M|re.S
              )
              rm=restore_pat.search(t)
              if not rm:
                  raise SystemExit("restore function missing")
              rf=rm.group(0)
              target='\tvar saved_view: String = str(restored_runtime.get("current_view", "main_grow_door"))\n'
              if target not in rf:
                  raise SystemExit("saved_view line missing")
              rf=rf.replace(
                  target,
                  target+'\tif saved_view == "locker":\n\t\tsaved_view = "main_workbench"\n',
                  1
              )
              t=t[:rm.start()]+rf+t[rm.end():]

              # Hard safety checks.
              if 'call_deferred("_init_personal_inventory_deferred")' in t:
                  raise SystemExit("inventory still initializes at startup")
              if 'backpack_quick_button = Button.new()' in t:
                  raise SystemExit("BAG UI still present")
              if 'if action_id == "station_locker":' not in t:
                  raise SystemExit("locker disable missing")
              if 'if saved_view == "locker":' not in t:
                  raise SystemExit("locker save repair missing")
              # Keep the helper defined so no stale references can break parsing.
              if 'func _init_personal_inventory_deferred() -> void:' not in t:
                  raise SystemExit("inventory helper unexpectedly missing")

              row[1]=t.encode()

          out=bytearray(blob[:fb]); cur=0; directory=[]
          for name,data,flags in entries:
              aligned=(cur+31)//32*32
              out.extend(b"\0"*(aligned-cur))
              off=aligned
              out.extend(data)
              cur=off+len(data)
              directory.append((name,off,len(data),hashlib.md5(data).digest(),flags))
          ndo=(len(out)+31)//32*32
          out.extend(b"\0"*(ndo-len(out)))
          struct.pack_into("<Q",out,32,ndo)
          out.extend(struct.pack("<I",len(directory)))
          for name,off,size,md5,flags in directory:
              raw=name.encode(); q=(len(raw)+3)//4*4
              out.extend(struct.pack("<I",q))
              out.extend(raw)
              out.extend(b"\0"*(q-len(raw)))
              out.extend(struct.pack("<Q",off))
              out.extend(struct.pack("<Q",size))
              out.extend(md5)
              out.extend(struct.pack("<I",flags))
          OUT.write_bytes(out)

          h=Path("index.html").read_text()
          h=re.sub(r'const AFB_TEST_RELEASE = "[^"]+";','const AFB_TEST_RELEASE = "0.7.9-beta.19-cloudtest.19";',h,1)
          h=re.sub(r'"fileSizes":\{[^}]*\}',f'"fileSizes":{{"{OUT.name}":{len(out)},"index.wasm":37902138}}',h,1)
          h=re.sub(r'"mainPack":"[^"]+"',f'"mainPack":"{OUT.name}"',h,1)
          Path("index.html").write_text(h)

          v=json.loads(Path("version.json").read_text())
          v["release_id"]="0.7.9-beta.19-cloudtest.19"
          v["inventory_status"]="disabled-clean-rollback-from-cloudtest12"
          Path("version.json").write_text(json.dumps(v,indent=2)+"\n")
          print("cloudtest19 built from cloudtest12")
          print("BAG removed; inventory startup disabled; locker disabled; old locker view repaired")
      - name: Commit generated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-cloudtest19.pck index.html version.json
          git commit -m "Publish clean cloudtest19 rollback"
          git push origin HEAD:main
