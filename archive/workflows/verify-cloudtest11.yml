name: Verify cloudtest11 against main
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-cloudtest11.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cloud
      - uses: actions/checkout@v4
        with:
          repository: FFDevelopment/afewbuds-beta
          ref: main
          path: stable
      - name: Compare critical runtime behavior
        shell: python
        run: |
          from pathlib import Path
          import struct,re,difflib
          def extract(path,target):
              b=Path(path).read_bytes()
              fb=struct.unpack_from("<Q",b,24)[0]
              do=struct.unpack_from("<Q",b,32)[0]
              n=struct.unpack_from("<I",b,do)[0]
              p=do+4
              for _ in range(n):
                  plen=struct.unpack_from("<I",b,p)[0]; p+=4
                  name=b[p:p+plen].rstrip(b"\0").decode(); p+=plen
                  off=struct.unpack_from("<Q",b,p)[0]; p+=8
                  size=struct.unpack_from("<Q",b,p)[0]; p+=8
                  p+=20
                  if name==target:
                      return b[fb+off:fb+off+size].decode("utf-8","replace").rstrip(" \n\0")
              return "<MISSING>"
          def func(text,name):
              m=re.search(r'^func '+re.escape(name)+r'\([^\n]*\)(?: -> [^:]+)?:\n.*?(?=^func |\Z)',text,re.M|re.S)
              return m.group(0).rstrip() if m else "<MISSING>"
          s=extract("stable/index-accountsync10.pck","scripts/main.gd")
          c=extract("cloud/index-cloudtest11.pck","scripts/main.gd")
          names=[
            "_ready","_notification","_install_lifecycle_hooks","_on_browser_pause",
            "_pause_gameplay","_resume_gameplay","_capture_runtime_state",
            "_restore_runtime_state","_go_to_view"
          ]
          for name in names:
              a=func(s,name).splitlines(); b=func(c,name).splitlines()
              d=list(difflib.unified_diff(a,b,fromfile="main",tofile="cloud11",lineterm=""))
              print("\n===== "+name+" =====")
              print("\n".join(d) if d else "IDENTICAL")
          print("\n===== PROJECT.GODOT DIFF =====")
          a=extract("stable/index-accountsync10.pck","project.godot").splitlines()
          b=extract("cloud/index-cloudtest11.pck","project.godot").splitlines()
          d=list(difflib.unified_diff(a,b,fromfile="main",tofile="cloud11",lineterm=""))
          print("\n".join(d) if d else "IDENTICAL")
