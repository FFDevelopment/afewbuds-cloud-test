name: Inspect dev wording
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-dev-wording.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find visible dev wording
        shell: python
        run: |
          from pathlib import Path
          import struct
          b=Path("index-cloudtest10.pck").read_bytes()
          fb=struct.unpack_from("<Q",b,24)[0]; do=struct.unpack_from("<Q",b,32)[0]
          n=struct.unpack_from("<I",b,do)[0]; p=do+4
          for _ in range(n):
              q=struct.unpack_from("<I",b,p)[0]; p+=4
              name=b[p:p+q].rstrip(b"\0").decode(); p+=q
              off=struct.unpack_from("<Q",b,p)[0]; p+=8
              size=struct.unpack_from("<Q",b,p)[0]; p+=8
              p+=20
              if not name.endswith(".gd"):
                  continue
              text=b[fb+off:fb+off+size].decode("utf-8","replace").rstrip(" \n\0")
              for i,line in enumerate(text.splitlines(),1):
                  low=line.lower()
                  if "fictional character" in low or "build afewbuds across eight" in low or "fictional" in low and "reeves" in low:
                      print(name,i,line)
